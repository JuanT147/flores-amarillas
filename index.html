<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div class="container">
        <h1>¡Aquí están tus flores amarillas!</h1>
        <h2>❤️ Mi bebita hermosa 🥺🌻</h2>

        <!-- Tu ramo de flores -->
        <img src="IMAGEN-SIN-FONDO-52-removebg-preview.png" alt="Ramo de girasoles" class="bouquet">

        <!-- Botón de Música Romántico -->
        <button id="btnMusica" class="btn-romantico">
            <span class="icono-rosa">🌹</span>
            <span class="texto-btn">
                <strong>Nuestra Canción</strong>
                <small id="estadoTexto">Toca para escuchar 🎵</small>
            </span>
        </button>
    </div>

    <!-- Contenedor de partículas de flores -->
    <div id="flowers-container"></div>

    <!-- Etiqueta de audio oculta -->
    <audio id="audioFondo" src="musica para flores.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
